# E2E smoke — Maestro flow. SPEC: START-01 (fresh install opens the interview), SHELL-01,
# SHELL-02 (boot + shell), and on-device behaviour proofs for the wired features: FOODS-02
# (search filters) and SUPP-03 (tap-to-take round-trips through the VM → Room).
#
# Proves the real app boots on a device/emulator, the bottom-nav shell works, and each
# feature's headline behaviour runs end-to-end on-device with real DI + Room. Selectors go
# by testTag (surfaced as resource-ids on Android via TestTagAutomation), never by display
# text. Nav-item ids are nav_<label-slug> — the slug rule lives in AppShell.kt's navItemTag
# (lowercase, non-[a-z0-9] runs collapsed to "_", trimmed); keep these ids in sync with it.
#
# Run:  maestro test qa/e2e/smoke.yaml      (device/emulator attached)
# The verify lane's e2eSmoke step runs this automatically when maestro + a device are present.
appId: com.kvdm.fuelled
---
- launchApp:
    clearState: true

# SPEC: START-01 — clearState IS a fresh install, so the first thing a real device shows is
# the interview, not the shell. Asserting the shell here is what this flow used to do, and it
# was wrong in a way no run could reveal: e2eSmoke SKIPs whenever no device is attached, so
# every device-free release passed over a flow that could not have passed on a clean device.
# Cold-start after clearState can exceed a bare assert's window on a slow/CI emulator (first
# Compose frame under load), so wait explicitly with a generous budget.
- extendedWaitUntil:
    visible:
      id: "onboarding_screen"
    timeout: 60000

# SPEC: START-01 — skipping keeps the seeded defaults, and the shell replaces the interview
# IN PLACE: no relaunch between the tap and the first tab. The fill-and-save half of START-01
# (writing through the Profile stores, rejecting a blank name or a non-positive number) is
# covered by the durable UI tests; what only a device can prove is that a fresh install gates
# on the interview at all and that dismissing it lands in the shell without a restart.
- tapOn:
    id: "onboarding_skip"

# SPEC: SHELL-01 — the first tab renders inside the shell, bottom nav visible.
- extendedWaitUntil:
    visible:
      id: "today_title"
    timeout: 60000
- assertVisible:
    id: "app_bottom_nav"
- assertNotVisible:
    id: "onboarding_screen"

# SPEC: SHELL-02, NAV-04, FOODS-02 — switch to Meals (the catalog tab, renamed from
# Foods — the nav id follows the label), then prove search filters the Room-backed
# catalog on-device: typing "Chicken" keeps Chicken breast and drops Almonds.
#
# Item ids are SLUGS (foods_item_<food.id>, FoodsScreen.kt) — `almonds`, `chicken-breast`,
# `baked-potato`. They were numeric (foods_item_1/_2) under the eight-food invented seed;
# 0.4.0's 59-food USDA catalog re-keyed them and this flow was never updated, because
# e2eSmoke SKIPs whenever no device is attached. Selectors here must be real ids, never
# positions — "item 1" stops meaning anything the moment the catalog is re-sorted.
- tapOn:
    id: "nav_meals"
- assertVisible:
    id: "foods_title"
# The catalog seeds into Room on first read, so the first item arrives after a round-trip
# rather than with the tab's first frame. Wait for it — a bare assert here races the seed.
- extendedWaitUntil:
    visible:
      id: "foods_item_almonds"
    timeout: 30000
- tapOn:
    id: "foods_search"
- inputText: "Chicken"
# The keyboard MUST be down before the bottom-nav assert and the nav taps below —
# the IME overlays the bottom bar, and an assert against a covered node fails on a working app.
#
# `pressKey: Enter` alone was the previous approach, on the reasoning that a singleLine field
# gets imeAction Done and Compose's default Done handler hides the IME. On Gboard/API 35 that
# is NOT what happens: observed 2026-08-04, Enter left the keyboard up and the bottom bar
# covered. hideKeyboard is used instead, and the hazard that ruled it out before — its BACK
# fallback reaching the activity and exiting the app (2026-07-28) — only applies when the IME
# is ALREADY down. Here it follows inputText directly, so the keyboard is reliably up and the
# BACK is consumed by the IME. Order matters: never hoist this above the inputText.
- hideKeyboard
# The query round-trips through the ViewModel → Room (a brief Loading arm clears the list
# between keystrokes), and a loaded emulator stretches that window. Wait for the search to
# SETTLE rather than asserting into the transition — this is the FOODS-02 proof, on-device.
- extendedWaitUntil:
    visible:
      id: "foods_item_chicken-breast"
    timeout: 30000
- extendedWaitUntil:
    notVisible:
      id: "foods_item_almonds"
    timeout: 30000
- assertVisible:
    id: "app_bottom_nav"

# SPEC: NAV-05 + SUPP-03 — Supplements is no longer a tab: it is a pushed destination,
# entered from Today's highlight. This is the on-device proof of BOTH halves — that the
# highlight opens it at all, and that a tap-to-take routes through the VM → Room and
# re-renders. Back then returns to Today, which a tab switch never did.
- tapOn:
    id: "nav_today"
- extendedWaitUntil:
    visible:
      id: "today_title"
    timeout: 30000
# The highlight sits below the hero and the focused container, so bring it into view first —
# tapOn targets an element's CENTRE, and a centre below the viewport lands on the bottom nav.
- swipe:
    direction: UP
    duration: 400
- tapOn:
    id: "today_supplements"
- extendedWaitUntil:
    visible:
      id: "supplements_title"
    timeout: 30000
- assertVisible:
    id: "supplements_summary"
- tapOn:
    id: "supplements_take_3"
- assertVisible:
    id: "supplements_summary"
# NAV-05: a pushed destination, so system-back returns to the surface that opened it.
- back
- extendedWaitUntil:
    visible:
      id: "today_screen"
    timeout: 30000

# SPEC: NAV-06 — Training is a tab, and it renders the whole week including rest days.
- tapOn:
    id: "nav_training"
- extendedWaitUntil:
    visible:
      id: "training_screen"
    timeout: 30000
- assertVisible:
    id: "training_summary"

# SPEC: SHELL-02 — Profile renders inside the shell.
- tapOn:
    id: "nav_profile"
- assertVisible:
    id: "profile_title"
- assertVisible:
    id: "app_bottom_nav"

# SPEC: NAV-02 + PLAN-02 + PLAN-04 — the Week TAB opens the structured day anchored on the
# current logical day, the plan renders all six containers whatever the hour, and a
# container's add control opens the tray ALREADY TARGETED at that container's slot.
#
# This used to go via `today_plan_link` and needed two `swipe UP` steps to reach it, because
# the link sat below Today's fold. NAV-03 withdrew that card and NAV-01 put the week on the
# bar, so the same destination is now one tap with no scrolling — which is the change this
# flow exists to prove as much as it is the reason for it.
#
# It is also the standing proof that a destination registered directly on the NavHost (outside
# AppShell) exposes its testTags to the automation layer at all: `exposeTestTagsForAutomation`
# sits on the NavHost in AppNavHost.kt, and while it sat inside AppShell instead,
# `meal_tray_screen` did not exist as a resource-id and no id-selector could see this screen.
# If that modifier ever moves back down, these steps fail.
- tapOn:
    id: "nav_week"
- extendedWaitUntil:
    visible:
      id: "meal_plan_screen"
    timeout: 30000
# PLAN-02, on-device: the day renders its containers interleaved with water even though nothing
# was ever written to it — the grid comes from the enum, not from stored rows.
#
# Only the first of each is asserted here. That all SIX render is proven exactly, and without a
# scroll, by the golden tree (PLAN-18) and MealPlanScreenTest; six meal cards plus six water
# rows is taller than a phone, so asserting the last one on-device would only be re-proving a
# deterministic fact through a flaky lens.
- assertVisible:
    id: "plan_slot_breakfast"
- assertVisible:
    id: "plan_water_1"
# Breakfast is the FIRST container, so it is on screen the moment the plan opens — PLAN-04's
# proof taps it directly, no scrolling needed.
- tapOn:
    id: "plan_add_breakfast"
- extendedWaitUntil:
    visible:
      id: "meal_tray_screen"
    timeout: 30000
# The tray is AIMED, not defaulted — the header states the slot the tap carried. Selection is
# still by id; the text is an assertion ON that element, never a way of finding it. The date
# half is the run's own logical day, so it stays a wildcard.
- assertVisible:
    id: "meal_tray_target"
    text: "Breakfast · .*"

# SPEC: MEAL-13 — pick a food, confirm, and the tray CLOSES back onto the container that
# opened it. On-device is the only place this clause is fully true: the pop is a back-stack
# act, so a screen test can prove the callback fires but only the real nav graph proves the
# user lands on the plan. Planning a day means doing this six times; a tray that stayed open
# made it six manual dismissals with the just-added food out of sight behind it.
# Slug id again (meal_tray_item_<food.id>, MealTrayScreen.kt) — `meal_tray_item_1` was written
# against the retired numeric seed and never ran on a device.
#
# The pick is the FIRST row, not a favourite food: the tray is a LazyColumn over 59 foods, so
# only the composed rows exist in the semantics tree at all — `meal_tray_item_chicken-breast`
# is simply absent until scrolled to (tried 2026-08-04). WHICH food is added is irrelevant to
# MEAL-13; that the tray closes back onto the container is the claim. Keep this on row one and
# the step needs no scrolling to stay true.
- tapOn:
    id: "meal_tray_item_almonds"
- tapOn:
    id: "meal_tray_add"
- extendedWaitUntil:
    visible:
      id: "meal_plan_screen"
    timeout: 30000
- assertVisible:
    id: "plan_slot_breakfast"
