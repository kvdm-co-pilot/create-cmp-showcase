# E2E smoke — Maestro flow. SPEC: SHELL-01, SHELL-02 (boot + shell), and on-device
# behaviour proofs for the wired features: FOODS-02 (search filters) and SUPP-03
# (tap-to-take round-trips through the VM → Room).
#
# Proves the real app boots on a device/emulator, the bottom-nav shell works, and each
# feature's headline behaviour runs end-to-end on-device with real DI + Room. Selectors go
# by testTag (surfaced as resource-ids on Android via TestTagAutomation), never by display
# text. Nav-item ids are nav_<label-slug> — the slug rule lives in AppShell.kt's navItemTag
# (lowercase, non-[a-z0-9] runs collapsed to "_", trimmed); keep these ids in sync with it.
#
# Run:  maestro test qa/e2e/smoke.yaml      (device/emulator attached)
# The verify lane's e2eSmoke step runs this automatically when maestro + a device are present.
appId: com.kvdm.fuelled
---
- launchApp:
    clearState: true

# SPEC: SHELL-01 — the app boots and the first tab renders inside the shell, bottom nav visible.
# Cold-start after clearState can take longer than a bare assert's default window on a slow/CI
# emulator (first Compose frame under load). Waiting for the first frame IS the SHELL-01 boot
# proof, so wait explicitly with a generous budget rather than asserting immediately.
- extendedWaitUntil:
    visible:
      id: "today_title"
    timeout: 60000
- assertVisible:
    id: "app_bottom_nav"

# SPEC: SHELL-02 + FOODS-02 — switch to Foods, then prove search filters the Room-backed
# catalog on-device: typing "Chicken" keeps Chicken breast (item 1) and drops Whey (item 2).
- tapOn:
    id: "nav_foods"
- assertVisible:
    id: "foods_title"
# The catalog seeds into Room on first read, so the first item arrives after a round-trip
# rather than with the tab's first frame. Wait for it — a bare assert here races the seed.
- extendedWaitUntil:
    visible:
      id: "foods_item_1"
    timeout: 30000
- tapOn:
    id: "foods_search"
- inputText: "Chicken"
- hideKeyboard
# The query round-trips through the ViewModel → Room (a brief Loading arm clears the list
# between keystrokes), and a loaded emulator stretches that window. Wait for the search to
# SETTLE rather than asserting into the transition — this is the FOODS-02 proof, on-device.
- extendedWaitUntil:
    visible:
      id: "foods_item_1"
    timeout: 30000
- extendedWaitUntil:
    notVisible:
      id: "foods_item_2"
    timeout: 30000
- assertVisible:
    id: "app_bottom_nav"

# SPEC: SHELL-02 + SUPP-03 — switch to Supplements and tap a take control; the tap routes
# through the ViewModel, persists to Room, and re-reads — the summary re-renders without crash.
- tapOn:
    id: "nav_supplements"
- assertVisible:
    id: "supplements_title"
- assertVisible:
    id: "supplements_summary"
- tapOn:
    id: "supplements_take_3"
- assertVisible:
    id: "supplements_summary"
- assertVisible:
    id: "app_bottom_nav"

# SPEC: SHELL-02 — Profile renders inside the shell.
- tapOn:
    id: "nav_profile"
- assertVisible:
    id: "profile_title"
- assertVisible:
    id: "app_bottom_nav"

# and back to Today
- tapOn:
    id: "nav_today"
- assertVisible:
    id: "today_title"

# SPEC: TODAY-12 + PLAN-02 + PLAN-04 — Today links into the full week, the plan renders all
# six containers whatever the hour, and a container's add control opens the tray ALREADY
# TARGETED at that container's slot.
#
# This goes via the PLAN screen deliberately. Today now shows only the FOCUSED container
# (TODAY-09), and which slot that is depends on the wall clock — so `today_add_breakfast` only
# exists in the early morning, and a flow asserting it would pass or fail by time of day. The
# plan screen always renders all six (PLAN-02), so `plan_add_breakfast` is there at any hour.
#
# It is also the standing proof that a destination registered directly on the NavHost (outside
# AppShell) exposes its testTags to the automation layer at all: `exposeTestTagsForAutomation`
# sits on the NavHost in AppNavHost.kt, and while it sat inside AppShell instead,
# `meal_tray_screen` did not exist as a resource-id and no id-selector could see this screen.
# If that modifier ever moves back down, these steps fail.
# The link sits below the fold — the hero, the protein card and the focused container fill the
# first screenful — so bring it up before tapping. `tapOn` targets an element's CENTRE, and a
# centre below the viewport lands on the bottom nav instead.
#
# Explicit swipes, NOT scrollUntilVisible: Compose reports a node's UNCLIPPED bounds in the
# semantics tree, so a row scrolled off the bottom still reads as 100% visible and
# scrollUntilVisible completes without moving anything. (Same measurement quirk the a11y step
# already discounts for touch targets.) Two swipes clear this screen's content on any phone.
- swipe:
    direction: UP
    duration: 400
- swipe:
    direction: UP
    duration: 400
- tapOn:
    id: "today_plan_link"
- extendedWaitUntil:
    visible:
      id: "meal_plan_screen"
    timeout: 30000
# PLAN-02, on-device: the day renders its containers interleaved with water even though nothing
# was ever written to it — the grid comes from the enum, not from stored rows.
#
# Only the first of each is asserted here. That all SIX render is proven exactly, and without a
# scroll, by the golden tree (PLAN-18) and MealPlanScreenTest; six meal cards plus six water
# rows is taller than a phone, so asserting the last one on-device would only be re-proving a
# deterministic fact through a flaky lens.
- assertVisible:
    id: "plan_slot_breakfast"
- assertVisible:
    id: "plan_water_1"
# Breakfast is the FIRST container, so it is on screen the moment the plan opens — PLAN-04's
# proof taps it directly, no scrolling needed.
- tapOn:
    id: "plan_add_breakfast"
- extendedWaitUntil:
    visible:
      id: "meal_tray_screen"
    timeout: 30000
# The tray is AIMED, not defaulted — the header states the slot the tap carried. Selection is
# still by id; the text is an assertion ON that element, never a way of finding it. The date
# half is the run's own logical day, so it stays a wildcard.
- assertVisible:
    id: "meal_tray_target"
    text: "Breakfast · .*"
