    45.3125%{transform:scaleX(0)}
    48.4375%{transform:scaleX(0);animation-timing-function:linear}
    70.3125%,100%{transform:scaleX(1)}
  }
  .bar4{animation:bar4 3200ms infinite;transform-origin:250px 220px}
  @keyframes bar4{
    0%,40.625%{transform:scaleX(1);animation-timing-function:cubic-bezier(0.3, 0, 0.8, 0.15)}
    45.3125%{transform:scaleX(0)}
    48.4375%{transform:scaleX(0);animation-timing-function:linear}
    82.8125%,100%{transform:scaleX(1)}
  }
  .bar5{animation:bar5 3200ms infinite;transform-origin:250px 254px}
  @keyframes bar5{
