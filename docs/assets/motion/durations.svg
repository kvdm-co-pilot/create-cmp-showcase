<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 316" width="920" height="316" role="img" aria-labelledby="t d">
<title id="t">The duration scale</title><desc id="d">Quick 120 ms, Standard 240 ms, Emphasized 400 ms, Expressive 700 ms, Celebration 1100 ms, ShimmerSweep 1200 ms — drawn on a shared time axis and filled at their real speeds.</desc>
<style>
