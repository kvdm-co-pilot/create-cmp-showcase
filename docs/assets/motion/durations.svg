<rect width="920" height="316" rx="18" fill="#0A0C0B"/>
<text class="sans eyebrow" x="20" y="30">THE DURATION SCALE — ONE TIME AXIS, EVERY BAR AT ITS TRUE SPEED</text>
<text class="sans dim" x="20" y="52" font-size="12">Six durations, six jobs. Nothing in the app animates for a length that is not one of these.</text>
<g>
  <text class="sans" x="20" y="78" font-size="13" font-weight="600">Quick</text>
  <text class="sans dim" x="20" y="93" font-size="10.5">press feedback, colour and state swaps, outgoing fades</text>
  <rect x="250" y="79" width="60" height="10" rx="5" fill="#232A26"/>
  <rect class="bar0" x="250" y="79" width="60" height="10" rx="5" fill="#B8FF3C"/>
  <text class="mono dim" x="900" y="84" font-size="11" text-anchor="end">120 ms</text>
</g>
<g>
  <text class="sans" x="20" y="112" font-size="13" font-weight="600">Standard</text>
  <text class="sans dim" x="20" y="127" font-size="10.5">fades, rises, cross-fades, expand and collapse</text>
  <rect x="250" y="113" width="120" height="10" rx="5" fill="#232A26"/>
  <rect class="bar1" x="250" y="113" width="120" height="10" rx="5" fill="#B8FF3C"/>
  <text class="mono dim" x="900" y="118" font-size="11" text-anchor="end">240 ms</text>
</g>
<g>
  <text class="sans" x="20" y="146" font-size="13" font-weight="600">Emphasized</text>
  <text class="sans dim" x="20" y="161" font-size="10.5">screen pushes and pops, tab fade-through</text>
  <rect x="250" y="147" width="200" height="10" rx="5" fill="#232A26"/>
  <rect class="bar2" x="250" y="147" width="200" height="10" rx="5" fill="#B8FF3C"/>
  <text class="mono dim" x="900" y="152" font-size="11" text-anchor="end">400 ms</text>
</g>
<g>
  <text class="sans" x="20" y="180" font-size="13" font-weight="600">Expressive</text>
  <text class="sans dim" x="20" y="195" font-size="10.5">the ring's sweep, the bars' first fill, count-ups</text>
  <rect x="250" y="181" width="350" height="10" rx="5" fill="#232A26"/>
  <rect class="bar3" x="250" y="181" width="350" height="10" rx="5" fill="#B8FF3C"/>
  <text class="mono dim" x="900" y="186" font-size="11" text-anchor="end">700 ms</text>
</g>
<g>
  <text class="sans" x="20" y="214" font-size="13" font-weight="600">Celebration</text>
  <text class="sans dim" x="20" y="229" font-size="10.5">the goal bloom — once per logical day, nothing else</text>
  <rect x="250" y="215" width="550" height="10" rx="5" fill="#232A26"/>
  <rect class="bar4" x="250" y="215" width="550" height="10" rx="5" fill="#B8FF3C"/>
  <text class="mono dim" x="900" y="220" font-size="11" text-anchor="end">1100 ms</text>
</g>
<g>
  <text class="sans" x="20" y="248" font-size="13" font-weight="600">ShimmerSweep</text>
  <text class="sans dim" x="20" y="263" font-size="10.5">the loading shimmer — the one loop in the app</text>
  <rect x="250" y="249" width="600" height="10" rx="5" fill="#232A26"/>
  <rect class="bar5" x="250" y="249" width="600" height="10" rx="5" fill="#B8FF3C"/>
  <text class="mono dim" x="900" y="254" font-size="11" text-anchor="end">1200 ms</text>
</g>
