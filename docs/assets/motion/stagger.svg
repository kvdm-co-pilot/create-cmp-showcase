<rect width="920" height="336" rx="18" fill="#0A0C0B"/>
<text class="sans eyebrow" x="20" y="30">THE ARRIVAL — MOTION-06</text>
<text class="sans dim" x="20" y="52" font-size="12">Modifier.enterRise(index) · every list in the app uses this one primitive</text>
  <g class="r0">
    <rect x="20" y="78" width="536" height="26" rx="9" fill="#121614"/>
    <circle cx="38" cy="91" r="3.5" fill="#B8FF3C"/>
    <text class="sans" x="54" y="91" font-size="12.5">Oats, 80 g</text>
    <text class="mono dim" x="542" y="91" font-size="11" text-anchor="end">+0 ms</text>
  </g>
  <g class="r1">
    <rect x="20" y="108" width="536" height="26" rx="9" fill="#121614"/>
    <circle cx="38" cy="121" r="3.5" fill="#B8FF3C"/>
    <text class="sans" x="54" y="121" font-size="12.5">Greek yoghurt, 170 g</text>
    <text class="mono dim" x="542" y="121" font-size="11" text-anchor="end">+40 ms</text>
  </g>
  <g class="r2">
    <rect x="20" y="138" width="536" height="26" rx="9" fill="#121614"/>
    <circle cx="38" cy="151" r="3.5" fill="#B8FF3C"/>
    <text class="sans" x="54" y="151" font-size="12.5">Banana</text>
