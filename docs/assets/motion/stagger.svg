    <text class="sans" x="54" y="301" font-size="12.5">Almonds, 25 g</text>
    <text class="mono lime" x="542" y="301" font-size="11" text-anchor="end">+240 ms · capped</text>
  </g>
<line x1="580" y1="30" x2="580" y2="306" stroke="#232A26"/>
<text class="sans eyebrow" x="604" y="30">WHY THE CAP</text>
<text class="sans dim" x="604" y="58" font-size="12">A list is dealt, not painted. Item i fades in</text>
<text class="sans dim" x="604" y="75" font-size="12">and rises 16 dp over 240 ms on the Enter curve,</text>
<text class="sans dim" x="604" y="92" font-size="12">delayed i × 40 ms.</text>
<text class="sans dim" x="604" y="126" font-size="12">Past item 6 the delay stops growing. Without</text>
<text class="sans dim" x="604" y="143" font-size="12">that cap a 40-row day would spend 1.6 s</text>
<text class="sans dim" x="604" y="160" font-size="12">arriving, and the stagger would read as lag.</text>
<text class="sans dim" x="604" y="194" font-size="12">It fires once per entry into the composition</text>
<text class="sans dim" x="604" y="211" font-size="12">— never on recomposition, never on scroll.</text>
<text class="mono lime" x="604" y="252" font-size="11">StaggerStepMs = 40</text>
<text class="mono lime" x="604" y="270" font-size="11">StaggerCap    = 6</text>
<text class="mono lime" x="604" y="288" font-size="11">EnterRise     = 16.dp</text>
</svg>
